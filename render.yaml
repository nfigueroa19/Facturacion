# Blueprint del PoC en Render: backend Ktor (Docker). Tablas en Appwrite TablesDB y PDF en Appwrite Storage.
# Solo datos ficticios (excepción PoC de AGENTS.md, sección 3).
# Pasos completos: _Segundo_Cerebro/02_Arquitectura/manual-despliegue-produccion-poc.md (fuera del repositorio).
services:
  - type: web
    name: api-facturacion
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /salud
    domains:
      - api-facturacion.hosusana.com
    envVars:
      - key: HSLV_CORS_ORIGENES
        value: https://facturacion.hosusana.com
      # El contenedor no guarda datos: tablas y soportes PDF van al proyecto de Appwrite.
      - key: HSLV_PERSISTENCIA
        value: appwrite
      - key: HSLV_APPWRITE_BASE
        value: facturacion_db
      - key: HSLV_APPWRITE_BUCKET
        value: soportes_pdf
      # Ninguna credencial va en variables: endpoint, proyecto y clave de API de Appwrite están dentro del PKCS12.
      # Sin alguno de estos alias el servicio no arranca.
      - key: HSLV_SECRETOS_ALMACEN_BASE64
        value: /etc/secrets/prefactura.p12.b64
      - key: HSLV_SECRETOS_CLAVE_ARCHIVO
        value: /etc/secrets/clave-almacen.txt
      - key: HSLV_SECRETOS_REQUERIDOS
        value: appwrite.endpoint,appwrite.proyecto,appwrite.clave
      - key: HSLV_FACTURADORES_PRUEBA
        value: /etc/secrets/facturadores.json
      # Escenarios de prueba con credenciales públicas y ficticias (/api/dev). Quitar antes de cargar datos reales.
      - key: HSLV_CATALOGO_PRUEBAS
        value: config/usuarios-prueba.json
